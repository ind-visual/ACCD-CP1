<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Gallery – Christina Lee</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Creating a 3D Cocktail</h1>
    <p>Documenting learnings & explorations</p>
  </header>

  <main class="gallery">
    <div class="gallery-item"><img src="images/work1.png" alt="Project 1" /></div>
    <div class="gallery-item"><img src="images/work2.png" alt="Project 2" /></div>
    <div class="gallery-item"><img src="images/work3.png" alt="Project 3" /></div>
    <div class="gallery-item"><img src="images/work4.png" alt="Project 4" /></div>
    <div class="gallery-item"><img src="images/work5.png" alt="Project 5" /></div>
    <div class="gallery-item"><img src="images/work6.png" alt="Project 6" /></div>
  </main>

  <!-- Lightbox modal -->
  <div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <span class="prev">&#10094;</span>
    <img class="lightbox-content" id="lightbox-img" alt="">
    <span class="next">&#10095;</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
