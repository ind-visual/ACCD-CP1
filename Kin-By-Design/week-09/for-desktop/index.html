<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Kin — The Village · v2</title>
<style>
  :root{
    --paper:#F4F0E6; --card:#FBF8F1; --ink:#2B2724; --muted:#8C8378;
    --line:#E4DCCE; --honey:#B07D34; --honey-soft:#EBD9BC;
    --sage:#6E7B5B; --sage-soft:#E4E7DA;
    --clay:#A5674F; --clay-soft:#EFDCD3;
    --wall1:#E7C79B; --wall2:#C9A7A0; --wall3:#9C93A8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:#2b2420;color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent}

  .phone{position:relative;width:min(420px,100vw);height:min(880px,100dvh);
    background:var(--paper);overflow:hidden;display:flex;flex-direction:column;
    border-radius:34px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
  @media (max-width:430px){ .phone{border-radius:0;height:100dvh} }

  /* ---- app shell ---- */
  .app{flex:1;display:flex;flex-direction:column;min-height:0}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .panel{display:none}
  .panel.active{display:block}

  /* ---- ambient glance (awareness without surveillance) ---- */
  .glance{background:linear-gradient(162deg,var(--wall1),var(--wall2) 58%,var(--wall3));
    padding:calc(env(safe-area-inset-top,14px) + 26px) 22px 22px}
  .glance-day{color:#4a3f36}
  .glance-day .d{font-size:15px;font-weight:600}
  .glance-day .t{font-size:40px;font-weight:700;letter-spacing:-1px;line-height:1;margin-top:1px}
  .glance-card{margin-top:20px;background:rgba(251,248,241,.90);backdrop-filter:blur(6px);
    border-radius:24px;padding:17px 18px 15px;border:1px solid rgba(255,255,255,.55);
    box-shadow:0 8px 22px rgba(60,45,25,.16)}
  .glance-label{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
  .presence{margin-top:11px;display:flex;flex-direction:column;gap:9px}
  .p-line{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.4}
  .p-dot{width:8px;height:8px;border-radius:50%;background:var(--honey);margin-top:6px;flex:0 0 auto;
    box-shadow:0 0 0 4px rgba(176,125,52,.14)}
  .p-line.soft .p-dot{background:var(--sage);box-shadow:0 0 0 4px rgba(110,123,91,.14)}
  .p-line.cool .p-dot{background:var(--clay);box-shadow:0 0 0 4px rgba(165,103,79,.14)}
  .trust{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--muted);line-height:1.45;display:flex;gap:8px}
  .trust svg{flex:0 0 auto;margin-top:1px}

  /* ---- home screen (the widget lives here) ---- */
  .home-screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
    background:linear-gradient(162deg,var(--wall1),var(--wall2) 58%,var(--wall3));
    padding:calc(env(safe-area-inset-top,14px) + 46px) 22px calc(env(safe-area-inset-bottom,0px) + 30px);
    transition:opacity .34s ease}
  .home-screen.gone{opacity:0;pointer-events:none}
  .hs-clock{color:#3f352c;text-align:center}
  .hs-clock .d{font-size:17px;font-weight:600}
  .hs-clock .t{font-size:66px;font-weight:700;letter-spacing:-2px;line-height:1;margin-top:2px}
  .widget{margin-top:30px;background:rgba(251,248,241,.92);backdrop-filter:blur(6px);
    border-radius:26px;padding:17px 18px 15px;cursor:pointer;border:1px solid rgba(255,255,255,.55);
    box-shadow:0 10px 26px rgba(60,45,25,.20);transition:transform .3s cubic-bezier(.2,.7,.3,1),opacity .26s ease}
  .widget:active{transform:scale(.975)}
  .widget.expanding{transform:translateY(-12px);opacity:0}
  .widget-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .widget-mark{width:24px;height:24px;border-radius:8px;background:var(--honey);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .widget-name{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--muted)}
  .w-events{margin-top:13px;display:flex;flex-direction:column;gap:9px}
  .w-event{border-radius:14px;padding:11px 13px;background:rgba(140,131,120,.12)}
  .w-event.school{background:rgba(176,125,52,.14)}
  .w-event.friends{background:rgba(110,123,91,.14)}
  .w-event.neighborhood{background:rgba(165,103,79,.13)}
  .w-event.family{background:rgba(142,124,166,.15)}
  .w-when{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--muted);text-transform:uppercase}
  .w-title{font-size:14.5px;font-weight:650;margin-top:3px;line-height:1.25}
  .w-mark{margin-left:7px}
  .w-mark.going{color:var(--honey)}
  .w-mark.saved{color:var(--clay)}
  .widget-tap{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);
    font-size:12px;color:var(--honey);font-weight:650}
  .hs-dots{margin-top:auto;display:flex;gap:16px}
  .hs-dot{flex:1;height:74px;border-radius:20px;background:rgba(251,248,241,.32);border:1px solid rgba(255,255,255,.38)}
  .hs-hint{text-align:center;color:rgba(45,35,25,.5);font-size:12px;margin-top:20px}

  /* ---- slim in-app header ---- */
  .vhead{display:flex;align-items:flex-start;justify-content:space-between;
    padding:calc(env(safe-area-inset-top,12px) + 22px) 20px 0;border-bottom:1px solid var(--line)}
  .vhead .h-left{display:flex;align-items:flex-start;gap:13px}
  .v-icon{height:64px;flex:0 0 auto;display:flex;align-items:flex-start}
  .v-icon img{height:100%;width:auto;display:block}
  .vhead .h-titles .day{font-size:12px;font-weight:650;color:var(--muted)}
  .vhead .h-titles .name{font-size:27px;font-weight:700;letter-spacing:-.5px;margin-top:1px;line-height:1}
  .vhead .h-titles .h-sub{font-size:13px;font-weight:600;color:var(--muted);margin-top:7px;display:flex;align-items:center;gap:6px}
  .vhead .h-titles .h-sub svg{flex:0 0 auto}
  .vhead .h-home{font-size:13px;font-weight:650;color:var(--honey);cursor:pointer;background:none;border:none;
    font-family:inherit;align-self:flex-start;margin-top:4px}
  .vtrust{font-size:12px;color:var(--muted);line-height:1.4;display:flex;gap:7px;
    padding:11px 20px 0}
  .vtrust svg{flex:0 0 auto;margin-top:1px}

  /* ---- village filter ---- */
  .filter{position:sticky;top:0;z-index:5;background:var(--paper);
    padding:14px 18px;border-bottom:1px solid var(--line)}
  .filter-scroll{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;padding-right:30px;
    cursor:grab;-webkit-mask-image:linear-gradient(to right,#000 87%,transparent);mask-image:linear-gradient(to right,#000 87%,transparent)}
  .filter-scroll.dragging{cursor:grabbing;user-select:none}
  .filter-scroll::-webkit-scrollbar{display:none}
  .vchip{white-space:nowrap;padding:8px 14px;border-radius:14px;border:1.5px solid var(--line);
    background:var(--card);font-size:13.5px;font-weight:650;color:var(--muted);cursor:pointer;
    font-family:inherit;transition:all .16s ease}
  .vchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .members{font-size:12.5px;color:var(--muted);line-height:1.45}
  .members:empty{display:none}
  .members:not(:empty){margin-top:10px}
  .members b{color:var(--clay);font-weight:650}
  .kidtoggle{display:inline-flex;align-items:center;gap:9px;margin-top:12px;background:none;border:none;
    cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:650;color:var(--muted);padding:0}
  .kt-track{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;
    transition:background .18s ease;flex:0 0 auto}
  .kt-thumb{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .18s ease}
  .kidtoggle[aria-pressed="true"]{color:var(--ink)}
  .kidtoggle[aria-pressed="true"] .kt-track{background:var(--sage)}
  .kidtoggle[aria-pressed="true"] .kt-thumb{transform:translateX(16px)}
  .board-empty{font-size:14px;color:var(--muted);line-height:1.5;background:var(--card);
    border:1px dashed var(--line);border-radius:16px;padding:16px 18px;text-align:center}
  /* give-side care offer: a different object, not a gathering */
  .offer-card{background:#F1E1D6;border-radius:22px;padding:17px 18px}
  .offer-top{display:flex;justify-content:space-between;align-items:center}
  .offer-who{display:flex;align-items:center;gap:10px}
  .offer-avatar{width:34px;height:34px;border-radius:50%;background:var(--clay);color:#fff;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
  .offer-name{font-weight:700;font-size:15.5px;color:var(--ink)}
  .offer-body{font-size:15.5px;line-height:1.5;margin-top:12px;color:var(--ink)}
  .offer-btn{margin-top:14px;padding:11px 18px;border-radius:14px;border:1.5px solid var(--clay);
    background:transparent;color:var(--clay);font-size:14px;font-weight:650;font-family:inherit;cursor:pointer}
  .offer-btn:active{transform:scale(.98)}
  .offer-btn.done{background:var(--sage);border-color:var(--sage);color:#fff;cursor:default}
  .offer-note{display:none;margin-top:11px;font-size:13px;font-weight:600;color:var(--sage)}
  .offer-note.show{display:block}

  /* ---- your week strip ---- */
  .week{padding:16px 18px 4px}
  .offers{padding:12px 18px 18px}
  #homeOffers{display:flex;flex-direction:column;gap:13px}
  .week-h{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:0 2px 10px}
  .week-scroll{display:flex;gap:10px}
  .wk-card{flex:1 1 0;min-width:0;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:11px 13px}
  .wk-card .wd{font-size:12px;font-weight:700;color:var(--honey)}
  .wk-card .wt{font-size:13.5px;font-weight:650;margin-top:3px;line-height:1.3}
  .wk-card .wp{font-size:11px;font-weight:650;color:var(--sage);margin-top:4px}
  .wk-card.held{border-style:dashed;border-color:var(--line);background:transparent;opacity:.72}
  .wk-card.held .wt{color:var(--muted)}
  .wk-card.held .wp{color:var(--muted)}
  .wk-empty{flex:1;font-size:13.5px;color:var(--muted);line-height:1.5;background:var(--card);
    border:1px dashed var(--line);border-radius:16px;padding:14px 15px}

  /* ---- board ---- */
  .board{padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:13px}
  .bcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px}
  .card-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .bcard .kicker{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--sage)}
  .aud{font-size:11px;font-weight:650;color:var(--clay);white-space:nowrap;
    display:flex;align-items:center;gap:4px}
  .aud .swatch{width:7px;height:7px;border-radius:2px;background:var(--clay)}
  .aud.school .swatch{background:var(--honey)} .aud.school{color:var(--honey)}
  .aud.friends .swatch{background:var(--sage)} .aud.friends{color:var(--sage)}
  .aud.neighborhood .swatch{background:var(--clay)} .aud.neighborhood{color:var(--clay)}
  .aud.family .swatch{background:#8E7CA6} .aud.family{color:#8E7CA6}
  .bcard h3{font-size:17.5px;font-weight:680;margin:7px 0 3px;letter-spacing:-.2px;line-height:1.25}
  .bcard .quote{font-size:15px;line-height:1.5;margin-top:7px;color:var(--ink)}
  .bcard .when{font-size:14px;font-weight:600;margin-top:2px}
  .bcard .meta{font-size:14px;font-weight:600;color:var(--ink);margin-top:6px;line-height:1.4}
  .bcard .who{font-size:13.5px;color:var(--muted);margin-top:7px;line-height:1.45}
  .voice{margin-top:11px;padding-left:12px;border-left:2.5px solid var(--honey-soft);
    font-size:14px;line-height:1.5;font-style:italic;color:var(--ink)}
  .voice .by{display:block;margin-top:4px;font-size:12.5px;color:var(--muted);font-style:normal;font-weight:600}
  .come{display:inline-block;margin-top:11px;font-size:12.5px;font-weight:650;
    color:var(--sage);background:var(--sage-soft);padding:5px 11px;border-radius:11px}

  .times{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
  .tchip{padding:9px 13px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);
    font-size:13.5px;font-weight:650;cursor:pointer;font-family:inherit;color:var(--ink);transition:all .15s ease}
  .tchip[aria-pressed="true"]{background:var(--honey);border-color:var(--honey);color:#fff}

  .actions{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
  .btn{padding:11px 15px;border-radius:14px;font-size:14px;font-weight:650;cursor:pointer;
    font-family:inherit;border:1.5px solid var(--line);background:var(--card);color:var(--ink);flex:1;
    transition:transform .12s ease}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--honey);border-color:var(--honey);color:#fff}
  .btn.commit{border-color:var(--honey);color:var(--honey);background:#fff}
  .btn.save{border-color:var(--honey);color:var(--honey);background:rgba(235,217,188,.28)}
  .btn.on{background:var(--honey);border-color:var(--honey);color:#fff}
  .btn.wide{flex-basis:100%}
  .note-field{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);
    background:#fff;font-size:14px;font-family:inherit;color:var(--ink);margin-top:11px}
  .note-field:focus{outline:2px solid var(--honey);outline-offset:1px;border-color:var(--honey)}

  .confirm{margin-top:13px;font-size:13.5px;font-weight:600;line-height:1.45;color:var(--sage);
    display:none;animation:rise .3s ease both}
  .confirm.lean{color:var(--honey)}
  .confirm.show{display:block}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .addcal{margin-top:11px;display:none;align-items:center;gap:7px;font-size:13px;font-weight:650;
    color:var(--honey);cursor:pointer;padding:9px 0}
  .addcal.show{display:inline-flex}
  .addcal.done{color:var(--sage);cursor:default}

  /* ---- calendar tab ---- */
  .cal-head{padding:calc(env(safe-area-inset-top,14px) + 24px) 22px 16px;border-bottom:1px solid var(--line)}
  .cal-head h2{font-size:24px;font-weight:700;letter-spacing:-.4px}
  .cal-head p{font-size:13.5px;color:var(--muted);margin-top:3px}
  .cal-wrap{padding:18px}
  .cal-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .cal-arrow{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--card);
    font-size:18px;line-height:1;color:var(--ink);cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .cal-arrow[disabled]{opacity:.32;cursor:default}
  .cal-month{font-size:15px;font-weight:700;text-align:center;letter-spacing:.2px;flex:1}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-dow{font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:4px;letter-spacing:.4px}
  .cal-cell{aspect-ratio:1;border-radius:11px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;font-size:13px;color:var(--ink);position:relative;border:1px solid transparent}
  .cal-cell.blank{visibility:hidden}
  .cal-cell.today{border-color:var(--honey);font-weight:700;color:var(--honey)}
  .cal-cell .cdot{width:5px;height:5px;border-radius:50%;background:var(--honey);position:absolute;bottom:7px}
  .cal-cell .cdot.held{background:transparent;border:1.5px solid var(--muted);width:6px;height:6px}
  .cal-cell.has .cnum{font-weight:650}
  .agenda{padding:6px 18px calc(env(safe-area-inset-bottom,0px) + 26px)}
  .agenda-h{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:14px 2px 10px}
  .ag-row{display:flex;gap:13px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:13px 15px;margin-bottom:10px}
  .ag-date{flex:0 0 auto;text-align:center;min-width:44px}
  .ag-date .m{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase}
  .ag-date .n{font-size:20px;font-weight:700;line-height:1}
  .ag-body .t{font-size:15px;font-weight:650}
  .ag-body .v{font-size:12px;font-weight:650;margin-top:3px}
  .ag-row.ghost{background:transparent;border-style:dashed;border-color:var(--line);opacity:.7}
  .ag-row.ghost .t{color:var(--muted);font-weight:600}
  .cal-legend{display:flex;gap:18px;margin-top:16px;padding:0 2px;font-size:12px;color:var(--muted)}
  .cal-legend span{display:inline-flex;align-items:center;gap:7px}
  .lg-dot{width:8px;height:8px;border-radius:50%}
  .lg-dot.solid{background:var(--honey)}
  .lg-dot.ring{background:transparent;border:1.5px solid var(--muted)}
  .cal-empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:18px;
    font-size:14px;color:var(--muted);line-height:1.55}
  .cal-note{margin-top:16px;font-size:12.5px;color:var(--muted);line-height:1.5;padding:0 2px}

  /* ---- tab bar ---- */
  .tabbar{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:var(--card);
    padding-bottom:env(safe-area-inset-bottom,0px)}
  .tab{flex:1;background:none;border:none;font-family:inherit;padding:11px 0 13px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}
  .tab.active{color:var(--honey)}
  .tab .lbl{font-size:11px;font-weight:650;letter-spacing:.2px}
  .tab svg{display:block}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="phone">

  <!-- ============ HOME SCREEN (widget entry) ============ -->
  <div class="home-screen" id="homeScreen">
    <div class="hs-clock"><div class="d">Saturday, August 15</div><div class="t">9:41</div></div>

    <div class="widget" id="villageWidget" role="button" tabindex="0" aria-label="Open the Village">
      <div class="widget-top">
        <span class="widget-mark"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-8Z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></span>
        <span class="widget-name">Right Now In Your Village</span>
      </div>
      <div class="w-events" id="wEvents"></div>
      <div class="widget-tap">Tap to open&nbsp;›</div>
    </div>

    <div class="hs-dots"><div class="hs-dot"></div><div class="hs-dot"></div></div>
  </div>

  <div class="app">
    <div class="scroll" id="scroll">

      <!-- ============ VILLAGE TAB ============ -->
      <section class="panel active" id="homePanel">

            <div class="cal-month" id="calMonthLabel"></div>
            <button class="cal-arrow" id="calNext" aria-label="Next month">›</button>
          </div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="cal-legend"><span><span class="lg-dot solid"></span>Going</span><span><span class="lg-dot ring"></span>Interested</span></div>
        </div>
        <div class="agenda" id="agenda"></div>
      </section>

    </div>

    <div class="tabbar">
      <button class="tab active" id="tab-home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-8Z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
        <span class="lbl">Home</span>
      </button>
      <button class="tab" id="tab-discover">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.9"/><path d="M15.5 8.5 13 13l-4.5 2.5L11 11l4.5-2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span class="lbl">Discover</span>
      </button>
      <button class="tab" id="tab-calendar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.9"/><path d="M4 9h16M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        <span class="lbl">Calendar</span>
      </button>
    </div>
  </div>
</div>

<script>
(function(){
  /* ---------- data ---------- */
  const villages = {
    all:          {label:'everyone you know', members:null},
    school:       {label:'ArtCenter', members:['Ana','the Kliemanns','Sarah','Priya',"Mina's family"]},
    neighborhood: {label:'3rd Ave', members:['the Kliemanns','the Ruiz-Parks','Dev & Mara','the block']},
    friends:      {label:'your friends', members:['Sarah','Priya','Jo','Lena']},
    family:       {label:'Family', members:['Mom','Dad','your sister','Jo']}
  };
  // the Kliemanns sit in school + neighborhood; Sarah sits in school + friends — overlap is normal.
  const audLabel = {school:'ArtCenter', neighborhood:'3rd Ave', friends:'DTLA crew', family:'Family'};

  const gatherings = [
    {id:'girls', kid:false, village:'friends', kind:'offer', type:'Invite', title:'Girls night',
     quote:'"I miss you! Getting a few of us together — pizza and wine, my place. Which night works?"',
     where:'Sarah’s place', who:'Sarah, Ana, and Priya are in.', times:['Thu 7pm','Fri 8pm','Sat 7pm'], timeDates:{'Thu 7pm':20,'Fri 8pm':21,'Sat 7pm':22},
     host:'Sarah', cal:{m:'Aug',n:21}},
    {id:'openhouse', kid:true, village:'neighborhood', kind:'dropin', type:'Weekly', title:'Open house',
     voice:'"Bring nothing, that’s the rule. Coffee’s on, drop by whenever, stay ten minutes or all morning."', voiceBy:'Ana Kliemann',
     when:'Saturdays, 9–11am', where:'rotates', who:'This week at the Kliemanns’.',
     come:'Open to all', cal:{m:'Aug',n:15}},
    {id:'pickle', kid:false, village:'friends', kind:'dropin', type:'Weekly', title:'Pickleball',
     when:'Tuesdays, 6:30pm', where:'the courts', who:'Paddles to spare. No skill required, mostly trash talk.', come:'Open to all', cal:{m:'Aug',n:18}},
    {id:'game', kid:false, village:'friends', kind:'dropin', type:'Bi-weekly', title:'Game night',
     when:'Every other Sunday, after 8pm', where:'rotates', who:'Grown-ups only, kids asleep. Snacks, cards, staying too late.', come:'Open to all', cal:{m:'Aug',n:16}},
    {id:'walk', kid:true, village:'neighborhood', kind:'dropin', type:'Weekly', title:'The slow walk',
     when:'Sunday mornings', where:'the park gate', who:'A loop and a coffee. Strollers, dogs, whoever.', come:'Open to all', cal:{m:'Aug',n:16}},
    {id:'mina', kid:true, village:'school', kind:'rsvp', type:'Celebration', title:'Mina turns four',
     when:'Sat Aug 22, afternoon', where:'the Kliemanns’', who:'Cake in the backyard. The Kliemanns bring the music.', host:'the Kliemanns', come:'Open to all', cal:{m:'Aug',n:22}},
    {id:'block', kid:true, village:'neighborhood', kind:'rsvp', type:'Seasonal', title:'Summer 2026 Block Party',
     when:'Sat Aug 30', where:'Oak Street', who:'Tables in the street, everyone’s grill. It happens every year.', host:'Oak St', come:'Open to all', cal:{m:'Aug',n:29}},
    {id:'apple', kid:true, village:'friends', kind:'rsvp', type:'Seasonal', title:'Apple picking & pie-making',
     when:'A Saturday in October', where:'the orchard', who:'Two cars, an orchard, far too many apples.', host:'Jo', come:'Open to all', cal:{m:'Oct',n:4}},
    {id:'dinner', kid:true, village:'family', kind:'rsvp', type:'Monthly', title:'Sunday dinner',
     when:'Sun Aug 23, 5pm', where:'Mom’s', who:'Everyone’s there. Bring your appetite.', host:'Mom', come:'Open to all', cal:{m:'Aug',n:23}}
  ];

  /* ---------- state ---------- */
  let currentVillage = 'all';
  let kidsOnly = false;
  let offerReached = false;
  const saved = {};            // id -> gathering (added to calendar / your week)
  const states = {};           // id -> 'firm' | 'held' | 'kept'
  const TODAY = 15;            // Sat Aug 15

  /* ---------- home screen -> app ---------- */
  const homeScreen=document.getElementById('homeScreen');
  const widget=document.getElementById('villageWidget');
  function enterApp(){
    widget.classList.add('expanding');
    setTimeout(()=>homeScreen.classList.add('gone'),150);
    setTimeout(()=>widget.classList.remove('expanding'),650);
  }
  widget.onclick=enterApp;
  widget.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();enterApp();} };
  document.getElementById('toHome').onclick=()=>{ homeScreen.classList.remove('gone'); renderWidget(); };

  // when you've saved nothing, the widget previews village happenings (fillers);
  // once you've saved things, it goes pure — only your items, marked.
  const WIDGET_FILLERS=[
    {when:'This morning', title:"Open house hang at Ana's", village:'neighborhood'},
    {when:'Friday',       title:'Girls night with Sarah',   village:'friends'},
    {when:'Sunday',       title:"Dinner at Mom's",           village:'family'}
  ];
  function renderWidget(){
    const box=document.getElementById('wEvents'); if(!box) return;
    const mine=Object.values(saved).sort(rankSort).slice(0,3);
    box.innerHTML='';
    if(mine.length){
      mine.forEach(g=>{
        const going=states[g.id]==='going';
        const mark='<span class="w-mark '+(going?'going':'saved')+'">'+(going?'Going':'Interested')+'</span>';
        box.appendChild(el('<div class="w-event '+g.village+'"><div class="w-when">'+g.cal.m+' '+g.cal.n+mark
          +'</div><div class="w-title">'+g.title+'</div></div>'));
      });
    } else {
      WIDGET_FILLERS.forEach(f=>{
        box.appendChild(el('<div class="w-event '+f.village+'"><div class="w-when">'+f.when+'</div><div class="w-title">'+f.title+'</div></div>'));
      });
    }
  }

  /* ---------- village filter + members ---------- */
  const membersEl = document.getElementById('members');
  function renderMembers(){
    if(currentVillage==='all'){ membersEl.innerHTML=''; return; }
    membersEl.textContent = villages[currentVillage].members.join(', ');
  }
  document.querySelectorAll('#vFilter .vchip').forEach(chip=>{
    chip.onclick=()=>{
      document.querySelectorAll('#vFilter .vchip').forEach(c=>c.setAttribute('aria-pressed','false'));
      chip.setAttribute('aria-pressed','true');
      currentVillage = chip.dataset.v;
      renderMembers(); renderBoard();
    };
  });
  document.getElementById('kidToggle').onclick=(e)=>{
    kidsOnly=!kidsOnly;
    e.currentTarget.setAttribute('aria-pressed', kidsOnly?'true':'false');
    renderBoard();
  };

  /* ---------- board ---------- */
  const boardEl = document.getElementById('board');
  function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }

  function buildOfferCard(){
    const c=document.createElement('div'); c.className='offer-card';
    c.innerHTML =
      '<div class="offer-top"><div class="offer-who"><span class="offer-avatar">M</span><span class="offer-name">Mom</span></div>'
      + audTag({village:'family'}) + '</div>'
      +'<div class="offer-body">I’m around Thursday night if anyone needs a hand. Happy to take a little one, run an errand, whatever helps.</div>';
    const btn=document.createElement('button'); btn.className='offer-btn';
    const note=document.createElement('div'); note.className='offer-note';
    function markDone(){
      btn.className='offer-btn done'; btn.textContent='Reached out ✓'; btn.onclick=null;
      note.className='offer-note show'; note.textContent='Your message went to Mom. Just between you two.';
    }
    btn.textContent='Reach out';
    btn.onclick=()=>{ offerReached=true; markDone(); };
    if(offerReached) markDone();
    c.appendChild(btn); c.appendChild(note);
    return c;
  }

  function renderOffers(){
    const box=document.getElementById('homeOffers'); if(!box) return;
    box.innerHTML='';
    const girls=gatherings.find(g=>g.id==='girls');
    if(girls) box.appendChild(buildCard(girls));   // the invite is addressed to you
    box.appendChild(buildOfferCard());
  }
  function renderBoard(){
    boardEl.innerHTML='';
    const list = gatherings.filter(g=>g.id!=='girls' && (currentVillage==='all'||g.village===currentVillage) && (!kidsOnly||g.kid));
    if(!list.length){
      boardEl.appendChild(el('<div class="board-empty">Nothing kid-friendly here. Try another village.</div>'));
      return;
    }
    list.forEach(g=>boardEl.appendChild(buildCard(g)));
  }

  function audTag(g){
    return '<span class="aud '+g.village+'"><span class="swatch"></span>'+audLabel[g.village]+'</span>';
  }

  function buildCard(g){
    const card = document.createElement('div');
    card.className='bcard';
    let inner = '<div class="card-top"><span class="kicker">'+g.type+'</span>'+audTag(g)+'</div>'
      + '<h3>'+g.title+'</h3>';
    if(g.quote) inner += '<div class="quote">'+g.quote+'</div>';
    const meta=[g.when,g.where].filter(Boolean).join(' · ');
    if(meta) inner += '<div class="meta">'+meta+'</div>';
    if(g.voice) inner += '<div class="voice">'+g.voice+'<span class="by">— '+g.voiceBy+'</span></div>';
    if(g.who) inner += '<div class="who">'+g.who+'</div>';
    if(g.come) inner += '<span class="come">'+g.come+'</span>';
    card.innerHTML = inner;

    // time chips for the offer
    if(g.kind==='offer'){
      const times = document.createElement('div'); times.className='times';
      g.times.forEach((t,i)=>{
        const c=document.createElement('button'); c.className='tchip'; c.textContent=t;
        c.setAttribute('aria-pressed', i===0?'true':'false');
        c.onclick=()=>{ [...times.children].forEach(x=>x.setAttribute('aria-pressed','false'));
          c.setAttribute('aria-pressed','true'); card._time=t;
          if(states[g.id]){ saved[g.id]=effectiveGathering(g,card); renderWeek(); renderCalendar(); } };
        times.appendChild(c);
      });
      card._time = g.times[0];
      card.appendChild(times);
    }

    // actions: I'm in / Interested are toggles (tap the active one to cancel)
    const actions = document.createElement('div'); actions.className='actions';
    card._goBtn   = mkBtn("I'm in",'commit',()=>toggle(g,card,'going'));
    card._saveBtn = mkBtn('Interested','save',()=>toggle(g,card,'saved'));
    actions.appendChild(card._goBtn); actions.appendChild(card._saveBtn);
    if(g.kind==='offer') actions.appendChild(mkBtn('Add a note','wide',()=>openNote(g,card)));
    card.appendChild(actions);
    const confirm=document.createElement('div'); confirm.className='confirm'; card.appendChild(confirm);
    card._confirm=confirm;
    return card;
  }

  function mkBtn(label,cls,fn){
    const b=document.createElement('button'); b.className='btn '+cls; b.textContent=label; b.onclick=fn; return b;
  }

  function effectiveGathering(g,card){
    if(g.timeDates && card && card._time && g.timeDates[card._time]!=null){
      return Object.assign({}, g, {cal:{m:g.cal.m, n:g.timeDates[card._time]}});
    }
    return g;
  }
  function toggle(g,card,which){
    const cur = states[g.id] || 'none';
    const next = (cur===which) ? 'none' : which;   // tapping the active one cancels it
    if(next==='none'){ delete states[g.id]; delete saved[g.id]; }
    else { states[g.id]=next; saved[g.id]=effectiveGathering(g,card); }
    paintButtons(g,card);
    renderWeek(); renderCalendar();
  }
  function paintButtons(g,card){
    const st = states[g.id] || 'none';
    if(card._goBtn){
      const on = st==='going';
      card._goBtn.classList.toggle('on',on);
      card._goBtn.textContent = on ? 'You’re in ✓' : "I'm in";
    }
    if(card._saveBtn){
      const on = st==='saved';
      card._saveBtn.classList.toggle('on',on);
      card._saveBtn.textContent = on ? 'Interested ✓' : 'Interested';
    }
  }

  function openNote(g,card){
    if(card.querySelector('.note-field')) return;
    const field=document.createElement('input');
    field.type='text'; field.className='note-field';
    field.placeholder='Leaning yes. Anything I should bring?';
    const row=document.createElement('div'); row.className='actions';
    const closeNote=()=>{ field.remove(); row.remove();
      const orig=card.querySelector('.actions'); if(orig) orig.style.display=''; };
    const send=mkBtn('Send to '+g.host,'primary',()=>{
      closeNote();
      states[g.id]='saved'; saved[g.id]=effectiveGathering(g,card); paintButtons(g,card);
      const c=card._confirm; c.className='confirm lean show'; c.textContent='Sent to '+g.host+'. Marked interested.';
      setTimeout(()=>{ c.className='confirm'; c.textContent=''; }, 2800);
      renderWeek(); renderCalendar();
    });
    const cancel=mkBtn('Cancel','',closeNote);
    row.appendChild(cancel); row.appendChild(send);
    card.querySelector('.actions').style.display='none';
    card.insertBefore(field, card._confirm);
    card.insertBefore(row, card._confirm);
    field.focus();
    field.onkeydown=e=>{ if(e.key==='Enter') send.click(); };
  }

  /* ---------- your week strip ---------- */
  const weekEl=document.getElementById('weekScroll');
  function renderWeek(){
    const items=Object.values(saved).sort(rankSort).slice(0,3);
    weekEl.innerHTML='';
    if(!items.length){
      weekEl.appendChild(el('<div class="wk-empty">Nothing here yet.</div>'));
    } else {
      items.forEach(g=>{
        const sv = states[g.id]==='saved';
        weekEl.appendChild(el('<div class="wk-card'+(sv?' held':'')+'"><div class="wd">'+g.cal.m+' '+g.cal.n
          +'</div><div class="wt">'+g.title+'</div><div class="wp">'+(sv?'Interested':'Going')+'</div></div>'));
      });
    }
    renderWidget();
  }

  /* ---------- calendar tab ---------- */
  const calGrid=document.getElementById('calGrid');
  const calLabel=document.getElementById('calMonthLabel');
  const calPrev=document.getElementById('calPrev');
  const calNext=document.getElementById('calNext');
  const agenda=document.getElementById('agenda');
  const DOW=['S','M','T','W','T','F','S'];
  // 2026: Aug 1 = Sat, Sep 1 = Tue, Oct 1 = Thu
  const MONTHS=[
    {key:'Aug', label:'August',    offset:6, days:31, today:TODAY},
    {key:'Sep', label:'September', offset:2, days:30, today:null},
    {key:'Oct', label:'October',   offset:4, days:31, today:null},
    {key:'Nov', label:'November',  offset:0, days:30, today:null},
    {key:'Dec', label:'December',  offset:2, days:31, today:null}
  ];
  let calMonthIndex=0;   // start on the month with today

  function renderCalendar(){
    const mo=MONTHS[calMonthIndex];
    calLabel.textContent=mo.label;
    calPrev.disabled = calMonthIndex===0;
    calNext.disabled = calMonthIndex===MONTHS.length-1;

    const dayState={};
    Object.values(saved).forEach(g=>{
      if(g.cal.m!==mo.key) return;
      const s = states[g.id]==='going' ? 'going' : 'saved';
      if(dayState[g.cal.n]!=='going') dayState[g.cal.n]=s;  // going (solid) wins the day
    });

    calGrid.innerHTML='';
    DOW.forEach(d=>calGrid.appendChild(el('<div class="cal-dow">'+d+'</div>')));
    for(let i=0;i<mo.offset;i++) calGrid.appendChild(el('<div class="cal-cell blank"></div>'));
    for(let n=1;n<=mo.days;n++){
      const s=dayState[n];
      let cls='cal-cell'; if(mo.today===n) cls+=' today'; if(s) cls+=' has';
      const dot = s ? '<span class="cdot'+(s==='saved'?' held':'')+'"></span>' : '';
      calGrid.appendChild(el('<div class="'+cls+'"><span class="cnum">'+n+'</span>'+dot+'</div>'));
    }
    renderAgenda();
  }
  function stepMonth(d){
    calMonthIndex=Math.max(0,Math.min(MONTHS.length-1,calMonthIndex+d));
    renderCalendar();
  }
  calPrev.onclick=()=>stepMonth(-1);
  calNext.onclick=()=>stepMonth(1);

  function agRow(g,ghost){
    return el('<div class="ag-row'+(ghost?' ghost':'')+'"><div class="ag-date"><div class="m">'+g.cal.m
      +'</div><div class="n">'+g.cal.n+'</div></div><div class="ag-body"><div class="t">'+g.title+'</div>'
      +audTag(g).replace('class="aud','class="v aud')+'</div></div>');
  }
  function renderAgenda(){
    const mo=MONTHS[calMonthIndex];
    const all=Object.values(saved).filter(g=>g.cal.m===mo.key);
    agenda.innerHTML='';
    if(!all.length){
      agenda.innerHTML='<div class="agenda-h">On your calendar</div>';
      agenda.appendChild(el('<div class="cal-empty">Nothing in '+mo.label+' yet.</div>'));
      return;
    }
    const going=all.filter(g=>states[g.id]==='going').sort(sortByDate);
    const maybe=all.filter(g=>states[g.id]==='saved').sort(sortByDate);
    if(going.length){
      agenda.appendChild(el('<div class="agenda-h">Going</div>'));
      going.forEach(g=>agenda.appendChild(agRow(g,false)));
    }
    if(maybe.length){
      agenda.appendChild(el('<div class="agenda-h">Interested</div>'));
      maybe.forEach(g=>agenda.appendChild(agRow(g,true)));
    }
  }

  function rankSort(a,b){
    const rank=g=> states[g.id]==='going' ? 0 : 1;   // Going before Interested
    return (rank(a)-rank(b)) || sortByDate(a,b);
  }
  function sortByDate(a,b){
    const order={Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
    return (order[a.cal.m]*100+a.cal.n)-(order[b.cal.m]*100+b.cal.n);
  }

  /* ---------- tabs ---------- */
  const scroll=document.getElementById('scroll');
  let currentTab='home';
  const scrollPos={home:0,discover:0,calendar:0};
  const TABS=['home','discover','calendar'];
  function showTab(which){
    if(which===currentTab) return;
    scrollPos[currentTab]=scroll.scrollTop;   // remember where we were
    TABS.forEach(t=>{
      document.getElementById(t+'Panel').classList.toggle('active', t===which);
      document.getElementById('tab-'+t).classList.toggle('active', t===which);
    });
    currentTab=which;
    scroll.scrollTop=scrollPos[which];        // and go back to it
  }
  document.getElementById('tab-home').onclick=()=>showTab('home');
  document.getElementById('tab-discover').onclick=()=>showTab('discover');
  document.getElementById('tab-calendar').onclick=()=>showTab('calendar');

  // click-drag to scroll the village pills (mouse without a trackpad)
  (function(){
    const el=document.getElementById('vFilter'); if(!el) return;
    let down=false,startX=0,startLeft=0,moved=false;
    el.addEventListener('mousedown',e=>{ down=true; moved=false; startX=e.pageX; startLeft=el.scrollLeft; el.classList.add('dragging'); });
    window.addEventListener('mousemove',e=>{ if(!down) return; const dx=e.pageX-startX; if(Math.abs(dx)>3) moved=true; el.scrollLeft=startLeft-dx; });
    window.addEventListener('mouseup',()=>{ down=false; el.classList.remove('dragging'); });
    el.addEventListener('click',e=>{ if(moved){ e.preventDefault(); e.stopPropagation(); moved=false; } }, true);
  })();

  /* ---------- init ---------- */
  renderMembers(); renderBoard(); renderWeek(); renderOffers(); renderCalendar();

  /* hidden reset: long-press anywhere for a second */
  let t=null;
  document.addEventListener('pointerdown',()=>{ t=setTimeout(()=>location.reload(),1000); });
  ['pointerup','pointercancel','pointermove'].forEach(e=>document.addEventListener(e,()=>clearTimeout(t)));
})();
</script>
</body>
</html>
